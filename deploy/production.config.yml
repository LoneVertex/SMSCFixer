---
app:
  name: SmscFixer
  package: com.smscfixer
  module_type: lsposed

deployment:
  environment: production
  candidate_artifact:
    path: app/build/outputs/apk/release/app-release-unsigned.apk
    status: unsigned_release_candidate
    manifest: app/build/outputs/apk/release/smscfixer-release-candidate.json
  deployable_artifact:
    policy: externally_signed_and_verified_apk_required
  rollout:
    strategy: staged
    stages:
      - name: internal
        scope: "internal rooted test devices"
      - name: limited
        scope: "small trusted cohort"
      - name: full
        scope: "approved target devices"

signing:
  owner: external_controlled_signing_step
  repository_secrets_permitted: false
  required_verification:
    - candidate manifest tag/version/commit/digest match
    - signed APK SHA-256 recorded
    - signing certificate digest recorded

migrations:
  required_on_release: true
  policy_file: docs/production/migrations.md

monitoring:
  log_tag: SmscFixer
  health_signals:
    - "hook_applied after supported-device reboot"
    - "expected redacted sms_replaced or replacement_preserved decision event"
    - "no repeated hook_install_failed, config_load_failed, or reflection_failure events"
  alerts:
    - "crash spike, routing mismatch, unexpected package scope, or failed preserve behavior"
    - "no hook_applied evidence after release rollout"

rollback:
  policy_file: docs/production/rollback.md

smoke_tests:
  script: scripts/smoke_test_prod_like.sh
  matrix_file: docs/testing/validation-matrix.md
  required: true
