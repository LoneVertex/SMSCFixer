name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: >-
          gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Enforce PR release notes sections
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          pr_path="repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
          pr_body="$(gh api "${pr_path}" --jq .body)"
          missing=0
          for section in "## Risk" "## Testing Evidence" "## Rollback Notes"; do
            if ! printf "%s" "${pr_body}" | grep -Fq "${section}"; then
              echo "Missing required PR section: ${section}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
      - name: Verify repository does not contain release secrets
        run: |
          version_name="$(
            awk -F'"' '/versionName/ { print $2; exit }' \
              app/build.gradle
          )"
          test -n "${version_name}"
          ./scripts/verify_release_config.sh "v${version_name}"
      - name: Lint, unit tests, and APK compilation
        run: >-
          ./gradlew --no-daemon lint test assembleDebug assembleRelease
          assembleDebugAndroidTest
      - name: Validate produced artifacts
        run: |
          set -euo pipefail
          output_dir=app/build/outputs/apk
          debug_apk="${output_dir}/debug/app-debug.apk"
          release_apk="${output_dir}/release/app-release-unsigned.apk"
          test_dir="${output_dir}/androidTest/debug"
          instrumentation_apk="${test_dir}/app-debug-androidTest.apk"
          artifacts=("${debug_apk}" "${release_apk}" "${instrumentation_apk}")
          for artifact in "${artifacts[@]}"; do
            test -f "${artifact}"
            sha256sum "${artifact}"
          done
