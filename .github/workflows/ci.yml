---
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
      - name: Enforce PR release notes sections
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          missing=0
          for section in "## Risk" "## Testing Evidence" "## Rollback Notes"; do
            if ! printf "%s" "${PR_BODY}" | grep -Fq "${section}"; then
              echo "Missing required PR section: ${section}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
      - name: Verify repository does not contain release secrets
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\\([^\"]*\\)".*/\\1/p' app/build.gradle | head -n 1)"
          test -n "${version_name}"
          ./scripts/verify_release_config.sh "v${version_name}"
      - name: Lint, unit tests, and build artifacts
        run: ./gradlew --no-daemon lint test assembleDebug assembleRelease
      - name: Validate produced artifacts
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk
