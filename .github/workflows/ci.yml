name: CI

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Enforce PR release notes sections
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          missing=0
          for section in "## Risk" "## Testing Evidence" "## Rollback Notes"; do
            if ! printf "%s" "${PR_BODY}" | grep -Fq "${section}"; then
              echo "Missing required PR section: ${section}"
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Lint, unit tests, and build artifacts
        run: ./gradlew --no-daemon lint test assembleDebug assembleRelease

      - name: Validate produced artifacts
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
