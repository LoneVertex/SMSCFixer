name: Release Candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  classify_release_tag:
    runs-on: ubuntu-latest
    outputs:
      production_tag: ${{ steps.classify.outputs.production_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - id: classify
        name: Classify release tag
        run: |
          set -euo pipefail
          version_name="$(
            awk -F'"' '/versionName/ { print $2; exit }' \
              app/build.gradle
          )"
          test -n "${version_name}"
          if [ "${GITHUB_REF_NAME}" = "v${version_name}" ]; then
            echo "production_tag=true" >> "${GITHUB_OUTPUT}"
          else
            echo "production_tag=false" >> "${GITHUB_OUTPUT}"
            message="Skipping production candidate checks for test tag:"
            echo "${message} ${GITHUB_REF_NAME}"
          fi

  unsigned-release-candidate:
    needs: classify_release_tag
    if: needs.classify_release_tag.outputs.production_tag == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: >-
          gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Verify release tag and configuration
        run: ./scripts/verify_release_config.sh "${GITHUB_REF_NAME}"
      - name: Build and test unsigned release candidate
        run: ./gradlew --no-daemon lint test assembleRelease
      - name: Create release candidate manifest
        run: |
          ./scripts/create_release_manifest.sh \
            "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/smscguard-release-candidate.json
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk \
            > app/build/outputs/apk/release/app-release-unsigned.apk.sha256
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: smscguard-unsigned-release-candidate-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            app/build/outputs/apk/release/smscguard-release-candidate.json
          if-no-files-found: error
