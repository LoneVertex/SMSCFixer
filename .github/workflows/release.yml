---
name: Release Candidate

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  unsigned-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
      - name: Verify release tag and configuration
        run: ./scripts/verify_release_config.sh "${GITHUB_REF_NAME}"
      - name: Build and test unsigned release candidate
        run: ./gradlew --no-daemon lint test assembleRelease
      - name: Create release candidate manifest
        run: |
          ./scripts/create_release_manifest.sh \
            "${GITHUB_REF_NAME}" \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/smscguard-release-candidate.json
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk \
            > app/build/outputs/apk/release/app-release-unsigned.apk.sha256
      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: smscguard-unsigned-release-candidate-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            app/build/outputs/apk/release/smscguard-release-candidate.json
          if-no-files-found: error
